spring.application.name=BillGeneration
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/BillDB?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50

#spring.jpa.defer-datasource-initialization = true
##spring.sql.init.mode = always
#spring.sql.init.data-location = classpath:data.sql

twilio.account.sid=${TWILIO_ACCOUNT_SID:}
twilio.auth.token=${TWILIO_AUTH_TOKEN:}
twilio.from.number=${TWILIO_FROM_NUMBER:}
twilio.whatsapp.from=${TWILIO_WHATSAPP_FROM:}
twilio.whatsapp.to=${TWILIO_WHATSAPP_TO:}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.debug=true

admin.email=${ADMIN_EMAIL:}
#stock.report.cron=0 * * * * *
stock.report.cron=0 0 9 * * *

app.billing.gst-rate=0.18
app.messages.order-success-text=Payment Successful. Order Placed Successfully
app.messages.order-failure-text=Payment Failed. Please try again
app.messages.order-sms-template=Hello %s, your order is confirmed. Order ID: %d, Bill No: %s, Items: %d, Payment: %s, Amount: Rs %s. Thank you.
app.messages.low-stock-subject=Low Stock Alert
app.messages.low-stock-template=Product: %s\nRemaining Stock: %d\nThreshold Quantity: %d

app.resilience.failure-threshold=3
app.resilience.open-state-seconds=60
app.retry.email.max-attempts=3
app.retry.email.delay-ms=500
app.retry.sms.max-attempts=3
app.retry.sms.delay-ms=500
app.mock-payment.fail-every-n-orders=0
